[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-dify-adapter"
version = "0.1.0"
description = "Use private Dify chat apps as LangChain chat models in LangGraph applications."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Paul H" }]
keywords = ["dify", "langchain", "langgraph", "chat-model", "private-deployment"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "langchain-core>=0.3.0,<2.0.0",
  "langgraph>=0.2.0,<2.0.0",
  "requests>=2.31.0,<3.0.0",
]

[project.optional-dependencies]
sqlite = ["langgraph-checkpoint-sqlite>=2.0.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/Paul-H1992/langgraph-dify-adapter"
Repository = "https://github.com/Paul-H1992/langgraph-dify-adapter"
Issues = "https://github.com/Paul-H1992/langgraph-dify-adapter/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
